name: Cazar ofertas de PS Plus

on:
  schedule:
    # Cada 30 minutos. Aviso honesto: el cron de GitHub Actions en repos
    # gratis NO es puntual — suele arrancar con 5-20 min de retraso y en horas
    # pico puede saltarse alguna ejecución. Para ofertas (que duran días) da
    # igual. Para un código gratis que vuela en 2 minutos, a veces llegarás
    # tarde: eso no lo arregla ningún bot en Actions.
    - cron: "*/30 * * * *"
  workflow_dispatch:   # Botón para correrlo manualmente cuando quieras.

permissions:
  contents: write      # Para guardar la lista de "ya vistos".

# Que dos ejecuciones no se pisen al escribir state/seen.json.
concurrency:
  group: psplus-alert
  cancel-in-progress: false

jobs:
  cazar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Buscar ofertas y códigos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcionales pero muy recomendados: sin ellos se usa el RSS público
          # de Reddit, que desde las IPs de GitHub Actions come 429 seguido.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          # Sin esta key, itad_source se calla y el resto sigue igual.
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
        run: python main.py

      - name: Guardar el estado
        run: |
          git config user.name "psplus-bot"
          git config user.email "bot@users.noreply.github.com"
          # Se guardan los TRES archivos de estado, no solo seen.json.
          # Guardar solo seen.json fue un fallo real: el historial de precios
          # y la marca del resumen semanal se perdían en cada ejecución, así
          # que el bot nunca detectaba una bajada y mandaba el resumen cada
          # media hora creyendo que era la primera vez.
          #
          # Nada de rebase: son archivos que el bot reescribe enteros en cada
          # pasada, así que dos versiones distintas siempre chocan y el rebase
          # se queda pidiendo resolución manual. Con un archivo generado no
          # hay nada que fusionar: lo de ahora es lo bueno.
          mkdir -p /tmp/estado
          cp state/seen.json /tmp/estado/ 2>/dev/null || true
          cp state/precios.json /tmp/estado/ 2>/dev/null || true
          cp state/latido.json /tmp/estado/ 2>/dev/null || true
          # reddit.json guarda cuándo se consultó por última vez. Si no se
          # guardara, cada pasada creería ser la primera y volveríamos a los
          # 429 de siempre — el mismo fallo que ya tuvimos con precios.json.
          cp state/reddit.json /tmp/estado/ 2>/dev/null || true
          ls /tmp/estado/*.json >/dev/null 2>&1 || exit 0
          git fetch origin main
          git reset --hard origin/main
          mkdir -p state
          cp /tmp/estado/*.json state/
          # Solo sus archivos: eneba.json lo lleva el otro workflow.
          git add state/seen.json state/precios.json state/latido.json state/reddit.json 2>/dev/null || true
          git commit -m "Actualizar estado del bot" || exit 0
          git push

      # Si algo falla (crash, dependencias, etc.), avisar por Telegram.
      - name: Avisar si el bot falló
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="🚨 El bot de PS Plus falló. Revisa la pestaña Actions en GitHub." \
            > /dev/null
