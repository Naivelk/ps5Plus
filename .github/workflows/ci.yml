name: Pruebas

# Red de seguridad: corre en cada cambio, sobre todo los de config.yaml.
# Es YAML editado a mano, y un fallo de indentación rompía el bot sin que
# nadie se enterara hasta que dejaban de llegar avisos.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v5

      - name: Instalar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Comprobar que todo compila
        run: python -m compileall -q .

      # compileall NO pilla los nombres inexistentes: son un NameError en
      # tiempo de ejecución. Pasó de verdad — al renombrar _leer a _leer_rss
      # quedó una llamada al nombre viejo, el CI dio verde y el bot murió al
      # correr. pyflakes sí lo detecta sin ejecutar nada.
      - name: Buscar nombres inexistentes e imports rotos
        run: |
          pip install pyflakes
          pyflakes *.py

      - name: Smoke test (sin red)
        run: python smoke_test.py
